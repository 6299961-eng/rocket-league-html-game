<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Soccer 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #0a0e27;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .score-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      font-size: 48px;
      font-weight: bold;
    }

    .score-box {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 25px;
      border-radius: 10px;
      min-width: 80px;
    }

    .score-box.orange { color: #ff5a5a; }
    .score-box.blue { color: #5aa7ff; }

    .timer {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 36px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 10px;
    }

    .mode-display {
      position: absolute;
      top: 100px;
      left: 30px;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 8px;
      max-width: 300px;
      line-height: 1.6;
    }

    .boost-meter {
      position: absolute;
      bottom: 80px;
      left: 30px;
      width: 250px;
    }

    .boost-label {
      font-size: 12px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .meter-bar {
      width: 100%;
      height: 18px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #0099ff);
      width: 100%;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 30px;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 8px;
      max-width: 300px;
      line-height: 1.8;
    }

    .speed-display {
      position: absolute;
      bottom: 80px;
      right: 30px;
      font-size: 28px;
      font-weight: bold;
      color: #5aa7ff;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 8px;
      min-width: 120px;
      text-align: center;
    }

    .speed-label {
      font-size: 12px;
      color: #aaa;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .menu-overlay.hidden {
      display: none;
    }

    .pause-menu {
      background: rgba(20, 40, 70, 0.95);
      border: 3px solid rgba(90, 167, 255, 0.8);
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
    }

    .pause-menu h2 {
      font-size: 36px;
      color: #5aa7ff;
      margin-bottom: 20px;
    }

    .pause-menu p {
      color: #ddd;
      font-size: 16px;
      margin: 10px 0;
    }

    .pause-menu button {
      background: linear-gradient(135deg, #5aa7ff, #7ac0ff);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .pause-menu button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="score-container">
      <div class="score-box orange" id="scoreOrange">0</div>
      <div class="score-box blue" id="scoreBlue">0</div>
    </div>

    <div class="timer" id="timer">5:00</div>

    <div class="mode-display" id="modeDisplay">
      <strong>MODO: PRÁCTICA</strong><br>
      Presiona: 1=Práctica | 2=2 Jugadores | 3=vs IA | 4=Entreno
    </div>

    <div class="boost-meter">
      <div class="boost-label">BOOST</div>
      <div class="meter-bar">
        <div class="meter-fill" id="boostBar"></div>
      </div>
    </div>

    <div class="controls">
      <strong>CONTROLES:</strong><br>
      W/A/S/D = Mover<br>
      ESPACIO = Boost<br>
      R = Reiniciar
    </div>

    <div class="speed-display">
      <div id="speedValue">0</div>
      <div class="speed-label">KM/H</div>
    </div>
  </div>

  <div id="pauseMenu" class="menu-overlay hidden">
    <div class="pause-menu">
      <h2 id="pauseTitle">PAUSADO</h2>
      <p id="pauseScore"></p>
      <button onclick="resumeGame()">Continuar</button>
      <button onclick="changeMode(0)">Práctica</button>
      <button onclick="changeMode(1)">2 Jugadores</button>
      <button onclick="changeMode(2)">vs IA</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const scoreOrangeEl = document.getElementById('scoreOrange');
    const scoreBlueEl = document.getElementById('scoreBlue');
    const timerEl = document.getElementById('timer');
    const boostBarEl = document.getElementById('boostBar');
    const speedValueEl = document.getElementById('speedValue');
    const modeDisplay = document.getElementById('modeDisplay');
    const pauseMenu = document.getElementById('pauseMenu');
    const pauseTitle = document.getElementById('pauseTitle');
    const pauseScore = document.getElementById('pauseScore');

    let gameState = {
      isRunning: true,
      isPaused: false,
      gameMode: 0, // 0=práctica, 1=2players, 2=vs IA, 3=entreno
      scoreOrange: 0,
      scoreBlue: 0,
      timeRemaining: 300
    };

    const keys = {};

    // =====================
    // VECTOR 3D
    // =====================
    class Vector3 {
      constructor(x = 0, y = 0, z = 0) {
        this.x = x;
        this.y = y;
        this.z = z;
      }

      add(v) {
        return new Vector3(this.x + v.x, this.y + v.y, this.z + v.z);
      }

      scale(s) {
        return new Vector3(this.x * s, this.y * s, this.z * s);
      }

      length() {
        return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
      }

      normalize() {
        const len = this.length();
        if (len === 0) return new Vector3(0, 0, 0);
        return new Vector3(this.x / len, this.y / len, this.z / len);
      }

      copy() {
        return new Vector3(this.x, this.y, this.z);
      }
    }

    // =====================
    // PELOTA
    // =====================
    class Ball {
      constructor() {
        this.pos = new Vector3(0, 40, 0);
        this.vel = new Vector3(0, 0, 0);
        this.radius = 8;
      }

      update() {
        this.vel.y -= 0.3;
        this.vel.x *= 0.995;
        this.vel.y *= 0.995;
        this.vel.z *= 0.995;

        this.pos.x += this.vel.x;
        this.pos.y += this.vel.y;
        this.pos.z += this.vel.z;

        if (this.pos.y < this.radius) {
          this.pos.y = this.radius;
          this.vel.y *= -0.75;
          this.vel.x *= 0.92;
          this.vel.z *= 0.92;
        }

        if (this.pos.x < -240) this.pos.x = -240;
        if (this.pos.x > 240) this.pos.x = 240;
        if (this.pos.z < -300) this.pos.z = -300;
        if (this.pos.z > 300) this.pos.z = 300;
      }

      reset() {
        this.pos = new Vector3(0, 40, 0);
        this.vel = new Vector3(0, 0, 0);
      }

      draw(ctx, screenX, screenY) {
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();
        ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // =====================
    // COCHE
    // =====================
    class Car {
      constructor(x, z, color) {
        this.pos = new Vector3(x, 10, z);
        this.vel = new Vector3(0, 0, 0);
        this.angle = 0;
        this.color = color;
        this.width = 12;
        this.length = 20;
        this.height = 8;
        this.speed = 0;
        this.maxSpeed = 35;
        this.boost = 100;
        this.maxBoost = 100;
      }

      update() {
        this.vel.y -= 0.3;
        this.vel.x *= 0.94;
        this.vel.z *= 0.94;

        const speed = Math.sqrt(this.vel.x * this.vel.x + this.vel.z * this.vel.z);
        if (speed > this.maxSpeed) {
          const scale = this.maxSpeed / speed;
          this.vel.x *= scale;
          this.vel.z *= scale;
        }

        this.pos.x += this.vel.x;
        this.pos.y += this.vel.y;
        this.pos.z += this.vel.z;

        if (this.pos.y < this.height / 2) {
          this.pos.y = this.height / 2;
          this.vel.y = 0;
        }

        if (this.pos.x < -220) this.pos.x = -220;
        if (this.pos.x > 220) this.pos.x = 220;
        if (this.pos.z < -280) this.pos.z = -280;
        if (this.pos.z > 280) this.pos.z = 280;

        if (this.boost < this.maxBoost) {
          this.boost += 0.4;
        }

        this.speed = speed;
      }

      accelerate(amount) {
        const cos = Math.cos(this.angle);
        const sin = Math.sin(this.angle);
        this.vel.x += cos * amount * 0.9;
        this.vel.z += sin * amount * 0.9;
      }

      turn(amount) {
        this.angle += amount * 0.06;
      }

      addBoost() {
        if (this.boost > 0) {
          this.boost = Math.max(0, this.boost - 1.2);
          const cos = Math.cos(this.angle);
          const sin = Math.sin(this.angle);
          this.vel.x += cos * 4;
          this.vel.z += sin * 4;
        }
      }

      reset(x, z) {
        this.pos = new Vector3(x, 10, z);
        this.vel = new Vector3(0, 0, 0);
        this.angle = 0;
        this.boost = this.maxBoost;
      }

      draw(ctx, screenX, screenY) {
        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.rotate(this.angle);

        ctx.fillStyle = this.color;
        ctx.fillRect(-this.width / 2, -this.length / 2, this.width, this.length);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(-this.width / 2 + 2, -this.length / 2 + 3, this.width - 4, 7);

        ctx.restore();
      }
    }

    const ball = new Ball();
    const carOrange = new Car(-60, -100, '#ff5a5a');
    const carBlue = new Car(60, 100, '#5aa7ff');

    // =====================
    // IA
    // =====================
    class AI {
      constructor(car) {
        this.car = car;
      }

      update(ball) {
        const dx = ball.pos.x - this.car.pos.x;
        const dz = ball.pos.z - this.car.pos.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        const targetAngle = Math.atan2(dz, dx);
        let angleDiff = targetAngle - this.car.angle;

        if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
        if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

        if (Math.abs(angleDiff) > 0.1) {
          this.car.turn(angleDiff > 0 ? 1 : -1);
        }

        if (dist < 250) {
          this.car.accelerate(1);
          if (dist < 100 && Math.random() > 0.75) {
            this.car.addBoost();
          }
        }
      }
    }

    let ai = null;

    // =====================
    // COLISIONES
    // =====================
    function checkCollision(car, ball) {
      const dx = ball.pos.x - car.pos.x;
      const dz = ball.pos.z - car.pos.z;
      const dy = ball.pos.y - car.pos.y;
      const dist = Math.sqrt(dx * dx + dz * dz + dy * dy);

      const minDist = car.width / 2 + ball.radius;

      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const nz = dz / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;
        ball.pos.x += nx * overlap;
        ball.pos.y += ny * overlap;
        ball.pos.z += nz * overlap;

        const carSpeedX = Math.cos(car.angle) * car.speed * 0.6;
        const carSpeedZ = Math.sin(car.angle) * car.speed * 0.6;

        ball.vel.x = nx * 14 + carSpeedX;
        ball.vel.y = ny * 10;
        ball.vel.z = nz * 14 + carSpeedZ;
      }
    }

    // =====================
    // GOLES
    // =====================
    function checkGoals() {
      if (ball.pos.x < -230 && Math.abs(ball.pos.z) < 85 && ball.pos.y < 65) {
        gameState.scoreBlue++;
        setTimeout(resetRound, 500);
      }

      if (ball.pos.x > 230 && Math.abs(ball.pos.z) < 85 && ball.pos.y < 65) {
        gameState.scoreOrange++;
        setTimeout(resetRound, 500);
      }
    }

    function resetRound() {
      ball.reset();
      carOrange.reset(-60, -100);
      carBlue.reset(60, 100);
    }

    // =====================
    // PROYECCIÓN 3D
    // =====================
    function project3D(x, y, z) {
      const cameraZ = 200;
      const scale = 300 / (cameraZ + z);

      const screenX = canvas.width / 2 + x * scale;
      const screenY = canvas.height / 2 + y * scale * 0.7;

      return { x: screenX, y: screenY, scale };
    }

    // =====================
    // DIBUJO
    // =====================
    function draw() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1ca45a';
      ctx.fillRect(0, canvas.height / 2 - 100, canvas.width, 200);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height / 2 - 100);
      ctx.lineTo(canvas.width / 2, canvas.height / 2 + 100);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(100, 150, 200, 0.2)';
      ctx.fillRect(0, canvas.height / 2 - 60, 70, 120);
      ctx.fillRect(canvas.width - 70, canvas.height / 2 - 60, 70, 120);

      const ballScreen = project3D(ball.pos.x, ball.pos.y, ball.pos.z);
      ball.draw(ctx, ballScreen.x, ballScreen.y);

      const orangeScreen = project3D(carOrange.pos.x, carOrange.pos.y, carOrange.pos.z);
      carOrange.draw(ctx, orangeScreen.x, orangeScreen.y);

      const blueScreen = project3D(carBlue.pos.x, carBlue.pos.y, carBlue.pos.z);
      carBlue.draw(ctx, blueScreen.x, blueScreen.y);
    }

    // =====================
    // CONTROLES
    // =====================
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === 'escape' || key === 'p') {
        gameState.isPaused = !gameState.isPaused;
        pauseMenu.classList.toggle('hidden');
        if (!gameState.isPaused) {
          updateModeDisplay();
        }
      }

      if (key === '1') changeMode(0);
      if (key === '2') changeMode(1);
      if (key === '3') changeMode(2);
      if (key === '4') changeMode(3);
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function changeMode(mode) {
      gameState.gameMode = mode;
      gameState.scoreOrange = 0;
      gameState.scoreBlue = 0;
      gameState.timeRemaining = 300;
      ball.reset();
      carOrange.reset(-60, -100);
      carBlue.reset(60, 100);
      gameState.isPaused = false;
      pauseMenu.classList.add('hidden');
      updateModeDisplay();

      if (mode === 2) {
        ai = new AI(carBlue);
      } else {
        ai = null;
      }
    }

    function resumeGame() {
      gameState.isPaused = false;
      pauseMenu.classList.add('hidden');
    }

    function updateModeDisplay() {
      const modes = ['PRÁCTICA', '2 JUGADORES', 'vs IA', 'ENTRENO'];
      const controls = [
        '1=Práctica | 2=2 Jugadores | 3=vs IA<br>P=Pausa | W/A/S/D=Mover | ESPACIO=Boost',
        '1=Práctica | 2=2 Jugadores | 3=vs IA<br>P1: W/A/S/D+ESPACIO | P2: FLECHAS+SHIFT',
        '1=Práctica | 2=2 Jugadores | 3=vs IA<br>Tú vs IA - W/A/S/D+ESPACIO',
        'ENTRENO DE DELANTERO - Anota goles'
      ];
      modeDisplay.innerHTML = `<strong>MODO: ${modes[gameState.gameMode]}</strong><br>${controls[gameState.gameMode]}`;
    }

    // =====================
    // LOOP PRINCIPAL
    // =====================
    let lastTime = Date.now();

    function gameLoop() {
      const now = Date.now();
      const deltaTime = (now - lastTime) / 1000;
      lastTime = now;

      if (!gameState.isPaused) {
        // Controles
        if (keys['w']) carOrange.accelerate(1);
        else if (keys['s']) carOrange.accelerate(-1);

        if (keys['a']) carOrange.turn(-1);
        if (keys['d']) carOrange.turn(1);

        if (keys[' ']) carOrange.addBoost();

        if (gameState.gameMode === 1) {
          if (keys['arrowup']) carBlue.accelerate(1);
          else if (keys['arrowdown']) carBlue.accelerate(-1);

          if (keys['arrowleft']) carBlue.turn(-1);
          if (keys['arrowright']) carBlue.turn(1);

          if (keys['shift']) carBlue.addBoost();
        } else if (gameState.gameMode === 2 && ai) {
          ai.update(ball);
        } else if (gameState.gameMode === 3) {
          // Entreno: IA intenta defender
          ai = new AI(carBlue);
          ai.update(ball);
        } else {
          // Práctica: ambos bajo control del jugador o semi-automáticos
          carBlue.accelerate(0.3);
        }

        if (keys['r']) {
          resetRound();
        }

        // Actualizar
        carOrange.update();
        carBlue.update();
        ball.update();

        checkCollision(carOrange, ball);
        checkCollision(carBlue, ball);

        checkGoals();

        // Timer
        gameState.timeRemaining -= deltaTime;
        if (gameState.timeRemaining < 0) {
          gameState.timeRemaining = 0;
          gameState.isPaused = true;
          pauseTitle.textContent = 'FIN DEL PARTIDO';
          pauseScore.textContent = `${gameState.scoreOrange} - ${gameState.scoreBlue}`;
          pauseMenu.classList.remove('hidden');
        }

        // UI
        scoreOrangeEl.textContent = gameState.scoreOrange;
        scoreBlueEl.textContent = gameState.scoreBlue;
        boostBarEl.style.width = (carOrange.boost / carOrange.maxBoost * 100) + '%';
        speedValueEl.textContent = Math.floor(carOrange.speed * 3.6);

        const min = Math.floor(gameState.timeRemaining / 60);
        const sec = Math.floor(gameState.timeRemaining % 60);
        timerEl.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    updateModeDisplay();
    gameLoop();
  </script>
</body>
</html>
